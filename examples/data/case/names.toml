# The names rule (plan section 2.2, PL-30) and the managing editor's additions.
#
# An utterance is removed from the case if any clause below matches. Matching is on whole words, case-insensitive,
# after two normalisations: full stops and apostrophes are dropped ("n. p. r." becomes "n p r", "lowe's" becomes
# "lowes") and runs of spaces are collapsed. The build prints the count each clause removes and writes
# massive/removed.tsv: the removed ids and the clauses that matched them, never the text.
#
# Ambiguous common words are left out of the text list (for example "echo", "zoom", "subway", "united", "delta"),
# so the rule does not remove every utterance that uses an ordinary word. Two exceptions are kept on purpose: the
# editor's named terms ("target", "chase", "messenger"), and "apple", which names a company in most of its uses
# (stock, store, complaints). About five utterances that mean the fruit are removed with it; that is the cost of
# the rule's conservative reading.

# (a) Any utterance with one of these slot types is removed, whatever the slot's value.
name_slot_types = ["business_name", "app_name", "transport_agency"]

# (c) Utterances whose device, radio, podcast or game slot names a product, station or title brand.
#     Matched on the normalised slot value.
